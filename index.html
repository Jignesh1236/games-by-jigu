<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>games by jigu</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.discordapp.com/attachments/1147110101828776008/1510622785360236545/image.png?ex=6a1d7c9a&amp;is=6a1c2b1a&amp;hm=d40e984ef8fd7e36f2888752e1e10d5efadcb000c23761c74a5b7b06949694e1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Syne:wght@400;600;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>

  <main id="main">
    <nav id="nunnigation" style="-webkit-text-stroke-color: rgb(0, 0, 0); background-color: rgba(5, 5, 5, 0.4);">
      <div id="image" class="naa">
        <img src="https://cdn.discordapp.com/attachments/1147110101828776008/1510622785360236545/image.png?ex=6a1d7c9a&amp;is=6a1c2b1a&amp;hm=d40e984ef8fd7e36f2888752e1e10d5efadcb000c23761c74a5b7b06949694e1" alt="logo" width="40px">
      </div>
      <div class="naa">
        <a href="#">about</a>
        <a href="#">credits</a>
      </div>
    </nav>
  </main>

  <section id="hero">
    <h1>Games<br>by <span>Jigu</span></h1>
    <p>91 games · click &amp; play instantly</p>
  </section>

  <section id="launcher">
    <div id="launcher-top">
      <input id="gsearch" placeholder="search games..." oninput="filter()">
      <span id="gcount"></span>
    </div>

    <div id="game-grid"></div>

    <div id="fwrap">
      <div id="fbar">
        <span id="ftitle">select a game above</span>
        <button id="btn-r" onclick="reloadGame()">↺ reload</button>
        <a id="btn-e" target="_blank">↗ new tab</a>
      </div>

      <div id="ph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="2" y="6" width="20" height="12" rx="2"></rect>
          <path d="M8 12h2m-1-1v2M14 11h.01M16 13h.01"></path>
        </svg>
        <p>choose a game to play here</p>
      </div>

      <div id="loading-msg">
        <div class="spinner"></div>
        <span id="loading-text">loading game...</span>
      </div>

      <iframe id="game-frame" allowfullscreen="" allow="autoplay; fullscreen; gamepad" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
    </div>
  </section>

  <footer>made with ♥ by jigu &nbsp;·&nbsp; powered by jsdelivr cdn</footer>

</body></html>
