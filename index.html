<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>games by jigu</title>
  <link rel="icon" type="image/x-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main id="main">
    <nav id="nunnigation">
      <div id="image" class="naa">
        <img src="logo.png" alt="jigu logo" width="40px">
      </div>
      <div class="naa">
        <a href="#">about</a>
        <a href="#">credits</a>
      </div>
    </nav>
  </main>

  <section id="hero">
    <h1>Games<br>by <span>Jigu</span></h1>
    <p id="hero-count">360+ games · click &amp; play instantly</p>
  </section>

  <section id="launcher">
    <div id="launcher-top">
      <input id="gsearch" placeholder="search games..." oninput="filter()">
      <span id="gcount"></span>
    </div>

    <div id="cat-bar"></div>

    <div id="game-grid"></div>

    <div id="fwrap">
      <div id="fbar">
        <span id="ftitle">select a game above</span>
        <button id="btn-r"  onclick="reloadGame()"     title="Reload">↺ reload</button>
        <button id="btn-fs" onclick="fullscreenGame()" title="Fullscreen">⛶ fullscreen</button>
        <a      id="btn-e"  target="_blank"             title="Open in new tab">↗ new tab</a>
      </div>

      <div id="ph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="2" y="6" width="20" height="12" rx="2"></rect>
          <path d="M8 12h2m-1-1v2M14 11h.01M16 13h.01"></path>
        </svg>
        <p>choose a game to play here</p>
      </div>

      <div id="loading-msg">
        <div class="spinner"></div>
        <span id="loading-text">loading game...</span>
      </div>

      <div id="game-hint">
        <p>⚠️ Game not showing? It may have been removed or blocked.</p>
        <a id="hint-newtab" href="#" target="_blank">↗ try opening in a new tab</a>
      </div>

      <iframe id="game-frame"
        allowfullscreen
        allow="autoplay; fullscreen; gamepad"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock">
      </iframe>
    </div>
  </section>

  <footer>made with ♥ by jigu &nbsp;·&nbsp; powered by jsdelivr cdn</footer>

<script src="./script.js"></script>
</body></html>
